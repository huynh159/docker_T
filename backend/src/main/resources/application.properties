spring.application.name=demo
spring.datasource.url=${DB_URL:jdbc:postgresql://miniapp-postgres:5434/todo_db}
spring.datasource.username=${DB_USERNAME:todo_user}
spring.datasource.password=${DB_PASSWORD:123456}

server.port=8080

# Cấu hình tự động tạo bảng Hibernate (quan trọng để có cấu trúc bảng mới)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Cấu hình Google Gemini API (gọi trực tiếp qua REST API)
gemini.api-key=${GEMINI_API_KEY:your-api-key-here}
gemini.model=gemini-2.5-flash