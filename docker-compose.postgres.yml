services:
  postgres:
    image: postgres:17-alpine
    container_name: miniapp-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: "123456"
    volumes:
      # Bind Mount: Lưu dữ liệu vào thư mục postgres-data
      - ./postgres-data:/var/lib/postgresql/data
      # Tự động nạp dữ liệu ban đầu
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      miniapp-network:
        aliases:
          - postgres  # Giúp backend gọi domain "postgres" sẽ trỏ vào container này
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  miniapp-network:
    external: true
